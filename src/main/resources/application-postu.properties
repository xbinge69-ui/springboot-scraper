server.port=8087
spring.application.name=scraper

# Thymeleaf — désactive le cache en développement
spring.thymeleaf.cache=false

# Pipeline output (points to Astro data file)
app.catalog.videos-file=../src/data/videos.json

# Bunny.net (the only CDN — all derivatives go here).
# The storage API key is sourced from the BUNNY_STORAGE_API_KEY
# environment variable so it never lands in source. See README for setup.
app.bunny.enabled=true
app.bunny.storage.api-key=6d2af0f4-aa51-4ffb-a9431e8e6105-7c13-4dce
app.bunny.storage.zone-name=spankycouples
app.bunny.storage.endpoint=https://storage.bunnycdn.com
# app.bunny.storage-region=                # uncomment for regional edge (e.g. "ny")
app.bunny.cdn.hostname=SpankyCouples6969.b-cdn.net
app.bunny.folder=videos

# Ollama settings
# Default model is "minimax-m3" from the Ollama library
# (https://ollama.com/library/minimax-m3). To use a different model,
# run `ollama pull <name>` and change app.ollama.model here.
app.ollama.enabled=true
app.ollama.url=http://localhost:11434
app.ollama.model=minimax-m3:cloud
app.ollama.timeout-seconds=120

# Minimax (hosted chat-completions API) settings.
#
# ⚠ This is a SEPARATE thing from the Ollama model "minimax-m3".
#   "minimax-m3" = Ollama library model, runs locally via Ollama (no key).
#   "Minimax"  = the company Minimax's hosted API at api.minimaxi.com
#                (needs an API key / subscription).
#
# This app uses the LOCAL Ollama model by default — that's what runs when
# you DON'T tick the "Use MiniMax" checkbox on the pipeline page. To use
# the hosted API instead, set enabled=true and configure an API key. We
# default to enabled=false so a missing/wrong key never breaks a pipeline
# run; the orchestrator falls back to Ollama automatically.
#
# 🔐 CREDENTIAL HANDLING (only if you flip enabled=true):
#   1. Best:   set MINIMAX_API_KEY in your environment.
#   2. Local:  put it in application-local.properties (gitignored).
#   3. NEVER:  commit the key to git.
app.minimax.enabled=false
app.minimax.base-url=https://api.minimaxi.com
app.minimax.model=minimax-m3
app.minimax.timeout-seconds=120
# app.minimax.api-key=                        # ← dev-only override; prefer env or local file
app.minimax.download-url=https://api.minimaxi.com

# Auto-load the gitignored local override file. If it doesn't exist,
# Spring Boot logs a DEBUG-level "not found" and moves on. This lets
# every developer drop their own secrets into application-local.properties
# without committing them.
spring.config.import=optional:application-local.properties

# FFmpeg derivative service
# Leave these unset (or comment out) to pick up ffmpeg/ffprobe from the
# system PATH — the recommended setup. We installed BtbN's GPL build
# (NVENC + QSV + AMF + libx265) at C:\ffmpeg\bin\, which is on PATH.
# If you need to pin a specific binary, set the absolute path below.
# app.ffmpeg.path=C:\\ffmpeg\\bin\\ffmpeg.exe
# app.ffprobe.path=C:\\ffmpeg\\bin\\ffprobe.exe
app.ffmpeg.path=D:\\PATH_Programs\\ffmpeg.exe
app.ffprobe.path=D:\\PATH_Programs\\ffprobe.exe
app.ffmpeg.preview-duration-seconds=5
app.ffmpeg.thumbnail-position=0.20
app.ffmpeg.preview-position=0.40
# Video codec: "h264" (universal) or "hevc" (~30-40% smaller at the
# same visual quality, narrower compatibility). When the GPU probe
# finds a matching GPU encoder for the chosen codec, the derivative
# service uses it automatically; otherwise the codec's CPU encoder
# (libx264 / libx265) is used.
#
# DEFAULT: h264. Most of the browser/player market plays H.264
# out-of-the-box. HEVC saves ~30% on file size but Chrome, Firefox,
# and most Windows setups can't decode it without a paid codec
# extension or a custom player. For a public web deployment, H.264
# is the only safe default. Switch to "hevc" only if you know your
# entire audience is on Safari or has the codec installed.
#
# Note: libx265 / hevc_nvenc must be compiled into your ffmpeg build.
# Run `ffmpeg -encoders | findstr 265` to check. The "BtbN" builds on
# https://github.com/BtbN/ffmpeg-builds include libx265.
app.ffmpeg.codec=h264

# Output resolution cap. The scale filter NEVER upscales — a 480p
# source stays 480p, a 720p source stays 720p, a 1080p source is
# downscaled to 720p (and a 1920x1080 tiktok portrait becomes
# 404x720 to preserve aspect). For web distribution of adult
# content, 720p is the de-facto standard (mobile + desktop both
# decode it cheaply, file size is reasonable). Lower to 854x480
# (480p) for ~40% smaller files if you can accept the resolution.
app.ffmpeg.target-max-width=1280
app.ffmpeg.target-max-height=720
# Preview clip (5s sample used as the hover preview): CRF 28 is
# fine for a 5s clip — quality barely matters at that size.
app.ffmpeg.preview-crf=28
app.ffmpeg.preview-preset=fast
# Compressed video: CRF controls output bitrate via libx264's rate-
# distortion optimization. The "right" value depends on the source
# AND the deployment target. For web-streamed adult content:
#
#   CRF 18-22 = visually lossless (archival masters). Output ~1500-
#               2500 kbps. WAY bigger than typical web sources.
#   CRF 23-25 = high quality, ~800-1200 kbps. Still bigger than most
#               web sources. Use only for archival-grade inputs.
#   CRF 26-27 = balanced, ~500-800 kbps. About the same size as the
#               source — only smaller when the source is over ~900 kbps.
#   CRF 28    = SWEET SPOT for adult web video with H.264. ~400-600
#               kbps. Noticeably smaller than typical web sources
#               (300-800 kbps). Visually indistinguishable from CRF
#               23-25 for this kind of content. ← DEFAULT.
#   CRF 30    = aggressive. ~250-400 kbps. Half the size of CRF 28.
#               Minor visible artifacts in busy motion scenes; fine
#               for fast-scrolling web playback.
#   CRF 32    = very aggressive. ~150-250 kbps. ~30% of CRF 28 size.
#               Visible quality loss; only use if CDN bandwidth bills
#               dominate.
#
# NB: x265_crf ≈ x264_crf + 5 for the same visual quality. If you
# switch app.ffmpeg.codec to hevc, bump this by 5.
app.ffmpeg.compressed-crf=28
app.ffmpeg.compressed-preset=medium
app.ffmpeg.thumbnail-quality=2
# Watermark (baked into compressed video + 5 preview clips)
app.ffmpeg.watermark.text=Spankycouples.com
app.ffmpeg.watermark.font-path=
app.ffmpeg.watermark.font-size-main=18
app.ffmpeg.watermark.font-size-clip=24
app.ffmpeg.watermark.opacity=0.85
app.ffmpeg.watermark.box-color=black@0.4
app.ffmpeg.watermark.box-border=6
app.ffmpeg.watermark.margin=12
app.ffmpeg.watermark.download-url=https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSans-Bold.ttf
# Bottom-center call-to-action baked into the 5 preview clips only.
# Set text to empty to disable. The 5s preview + the full compressed
# video do NOT get this overlay. Font size is 18 — same as the main
# watermark, easy to read on a 280px-wide preview card without being
# intrusive.
app.ffmpeg.clip-overlay.text=See more SpankyCouples.com
app.ffmpeg.clip-overlay.font-size=18
# 5 preview clips (1 from start, 3 from middle, 1 from end) — each 25s
app.ffmpeg.preview-clip-seconds=25
app.ffmpeg.preview-clip-positions=0.05,0.35,0.50,0.65,0.95
# GPU acceleration. If a supported hardware H.264 encoder is found at
# startup (NVIDIA NVENC, Intel QSV, AMD AMF), the derivative jobs use
# it instead of libx264 — much faster and far less CPU.
# Set enabled=false to force libx264 (CPU) regardless of hardware.
app.ffmpeg.gpu.enabled=true
app.ffmpeg.gpu.preference=nvidia,intel,amd
# Hardware decode + filter chain. Orthogonal to gpu.enabled above:
# gpu.enabled picks the ENCODER, hwaccel.decode-enabled picks whether
# the source is decoded on the GPU (NVDEC), and hwaccel.filter-chain-
# enabled picks whether the filter chain runs on the GPU (scale_cuda).
# Both are auto-disabled when the ffmpeg build lacks the corresponding
# primitive — the GpuFilterChainProbe checks at startup.
# The decode-on-GPU change is the biggest single CPU win (1× CPU
# decode → NVDEC). The filter-on-GPU change moves the scale work too.
app.ffmpeg.hwaccel.decode-enabled=true
app.ffmpeg.hwaccel.filter-chain-enabled=true
# scale_cuda algorithm. Lanczos is not implemented on CUDA; the
# default bicubic is the closest available.
app.ffmpeg.hwaccel.scale-algorithm=bicubic
# 5 preview clips run in parallel on the GPU, capped at the GPU's
# NVENC session limit. 3 on most GeForce cards (4-session-per-process
# ffmpeg can hold 3 concurrent encodes); 2 is a safe default.
app.ffmpeg.preview-clip-parallelism=2
# Maximum simultaneous ffmpeg processes for the main pipeline (probe
# + 3-output process). Replaces the hardcoded cores/2 cap. Bump if
# you have lots of RAM and want more parallel requests; lower if you
# OOM under load.
app.enrichment.ffmpeg-permits=4

# Enrichment endpoint (POST /api/video/enrich)
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=120s
app.enrichment.ffmpeg-timeout-seconds=300
app.enrichment.ollama-format=json
app.enrichment.ollama-temperature=0.2
app.enrichment.max-download-bytes=2147483648
app.enrichment.download-connect-timeout-seconds=30
app.enrichment.download-read-timeout-seconds=300
app.enrichment.sweeper-stale-minutes=60

