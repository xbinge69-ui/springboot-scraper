server.port=8087
spring.application.name=scraper

# Thymeleaf — désactive le cache en développement
spring.thymeleaf.cache=false

# Pipeline output (points to Astro data file)
app.catalog.videos-file=../src/data/videos.json

# Bunny.net (the only CDN — all derivatives go here).
# The storage API key is sourced from the BUNNY_STORAGE_API_KEY
# environment variable so it never lands in source. See README for setup.
app.bunny.enabled=true
app.bunny.storage.api-key=6d2af0f4-aa51-4ffb-a9431e8e6105-7c13-4dce
app.bunny.storage.zone-name=spankycouples
app.bunny.storage.endpoint=https://storage.bunnycdn.com
# app.bunny.storage-region=                # uncomment for regional edge (e.g. "ny")
app.bunny.cdn.hostname=SpankyCouples6969.b-cdn.net
app.bunny.folder=videos

# Ollama settings
app.ollama.enabled=true
app.ollama.url=http://localhost:11434
app.ollama.model=mistral
app.ollama.timeout-seconds=120

# MiniMax (hosted chat-completions API) settings.
# The API key is read from the MINIMAX_API_KEY environment variable.
# It is NEVER stored in this file or in source control. To enable:
#   1. export MINIMAX_API_KEY="sk-cp-..."   (Linux/macOS)
#      setx MINIMAX_API_KEY "sk-cp-..."      (Windows, then restart the shell)
#   2. set app.minimax.enabled=true
# If the env var is missing, the provider is reported as "not configured"
# and the pipeline page disables the "Use MiniMax" checkbox automatically.
app.minimax.enabled=false
app.minimax.base-url=https://api.minimaxi.com
app.minimax.model=MiniMax-Text-01
app.minimax.timeout-seconds=120
# app.minimax.api-key=                     # dev-only override; prefer the env var

# FFmpeg derivative service
app.ffmpeg.path=ffmpeg
app.ffprobe.path=ffprobe
app.ffmpeg.preview-duration-seconds=5
app.ffmpeg.thumbnail-position=0.20
app.ffmpeg.preview-position=0.40
app.ffmpeg.target-max-width=1280
app.ffmpeg.target-max-height=720
app.ffmpeg.preview-crf=28
app.ffmpeg.preview-preset=fast
app.ffmpeg.compressed-crf=23
app.ffmpeg.compressed-preset=medium
app.ffmpeg.thumbnail-quality=2
# Watermark (baked into compressed video + 5 preview clips)
app.ffmpeg.watermark.text=Spankycouples.com
app.ffmpeg.watermark.font-path=
app.ffmpeg.watermark.font-size-main=18
app.ffmpeg.watermark.font-size-clip=24
app.ffmpeg.watermark.opacity=0.85
app.ffmpeg.watermark.box-color=black@0.4
app.ffmpeg.watermark.box-border=6
app.ffmpeg.watermark.margin=12
app.ffmpeg.watermark.download-url=https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSans-Bold.ttf
# 5 preview clips (1 from start, 3 from middle, 1 from end) — each 25s
app.ffmpeg.preview-clip-seconds=25
app.ffmpeg.preview-clip-positions=0.05,0.35,0.50,0.65,0.95

# Enrichment endpoint (POST /api/video/enrich)
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=120s
app.enrichment.ffmpeg-timeout-seconds=300
app.enrichment.ollama-format=json
app.enrichment.ollama-temperature=0.2
app.enrichment.max-download-bytes=2147483648
app.enrichment.download-connect-timeout-seconds=30
app.enrichment.download-read-timeout-seconds=300
app.enrichment.sweeper-stale-minutes=60

